<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adworld Designer's | Branding, Design, Impact</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* COLOR PALETTE & VARIABLES */
        :root {
            --primary: #FF3E00;    /* High-impact Orange-Red */
            --bg-dark: #050505;    /* Deep Black */
            --bg-card: #111111;    /* Dark Grey for Contrast */
            --text-light: #FFFFFF; /* Pure White */
            --text-dim: #A0A0A0;   /* Muted Grey */
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        h1, h2, h3, .logo {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        /* NAVIGATION */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(5, 5, 5, 0.98);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #1a1a1a;
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary);
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: var(--transition);
        }

        nav ul li a:hover {
            color: var(--primary);
        }

        /* HERO SECTION */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 8%;
            background: radial-gradient(circle at 80% 20%, #1a1a1a 0%, #050505 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary);
            filter: blur(180px);
            bottom: -100px;
            left: -100px;
            opacity: 0.15;
        }

        .hero-content {
            z-index: 2;
        }

        .hero-content h1 {
            font-size: clamp(3rem, 10vw, 5.5rem);
            line-height: 1;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .hero-content h1 span {
            color: var(--primary);
            text-shadow: 0 0 30px rgba(255, 62, 0, 0.4);
        }

        .hero-content p {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 35px;
            max-width: 550px;
        }

        .btn-primary {
            display: inline-block;
            padding: 16px 45px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 700;
            border-radius: 4px;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(255, 62, 0, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 62, 0, 0.4);
        }

        /* SERVICES SECTION */
        .services {
            padding: 120px 8%;
            background-color: var(--bg-dark);
        }

        .services h2 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 80px;
            letter-spacing: 2px;
        }

        .services h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--primary);
            margin: 20px auto 0;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

            background: var(--bg-card);
            padding: 50px 40px;
            border-radius: 12px;
